name: CI Backend

on:
  push:
    paths:
      - 'server/**'
      - 'packages/**'
  pull_request:
    paths:
      - 'server/**'
      - 'packages/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: server
        run: npm ci || npm install
      - name: Lint & Test
        working-directory: server
        run: |
          npm run lint --if-present
          npm test --if-present
